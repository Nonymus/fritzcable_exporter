name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    name: Tag Release
    outputs:
      release_created: ${{ steps.release.outputs.new_release_published }}
      tag: ${{ steps.release.outputs.new_release_git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 #v8.1.3
        id: release
        with:
          skip_npm_plugin: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          echo "Created: ${{ steps.release.outputs.new_release_published }}"
          echo "Tag: ${{ steps.release.outputs.new_release_git_tag }}"
  release:
    runs-on: ubuntu-latest
    name: Create Release
    needs: [ tag ]
    if: ${{ needs.tag.outputs.release_created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag_name }}
          fetch-depth: 0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de #v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
